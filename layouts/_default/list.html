{{ define "title" }}
	{{ .Title }} &ndash; {{ .Site.Title }}
{{ end }}

{{ define "main" }}
	<article class="main-text">
	<header>
		<h1>{{ .Title }}</h1>
		<hr>
	</header>
		{{ .Content }}
		{{ if .Pages }}
		<div class="toc">
			<ul>
				{{ range .Pages }}
				<li>
					<a href="{{ .RelPermalink }}">
						{{ .LinkTitle }}
					</a>
				</li>
				{{ end }}
			</ul>
		</div>
		{{ end }}
	</article>
{{ end }}

{{ define "footer" }}
{{ end }}
